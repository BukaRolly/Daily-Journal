<!DOCTYPE html>
<html>
<head>
  <title>Google Sheets Data</title>
</head>
<body>
 
<div id="Submissions-Table"></div>

<script>
  const currentUser = localStorage.getItem('currentUser');
  const GoogleScriptWebApp = 'https://script.google.com/macros/s/AKfycbxkpFj8KvO6B2PQE1EOTIk56sovcoN_VCmas2HBApSW1VDv11bGM9nB23Ap25fxz0g/exec?filterValue=' + encodeURIComponent(currentUser);

  function createSubmmissionsTable(data) {

    const header = [
    "How have you felt today?",
    "Did you have any frustrations today?",
    "Did you feel strong and capable today?",
    "Do you feel appreciated and loved today?",
    "How do you feel about your partner?",
    "Reveal your answer to your partner?",
    "User",
    "Date"
  ];    
    const rows = data.slice(1).reverse();
    const data_backwards = [header, ...rows];

    let table = '<table border="1">';
    data_backwards.forEach((row, rowIndex) => {
      table += '<tr>';
      row.forEach((cell) => {
        if (rowIndex ===0) {
          table += '<th>' + cell + '</th>';
        } else {
          table += '<td>' + cell + '</td>';
        }
      });
      table += '</tr>';
    });
    table += '</table>';
    document.getElementById('Submissions-Table').innerHTML =table;
  }

  fetch(GoogleScriptWebApp)
    .then(response => response.json())
    .then(data => {
      console.log(data)
      createSubmmissionsTable(data);
    })
    .catch(error => {
      console.error('Erorr Fetchiing Data', error);
    });

</script>
